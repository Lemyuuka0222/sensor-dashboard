<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperatura &middot; Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --temp:#22c55e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--txt); }
  header { padding: 18px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #334155; gap:12px; flex-wrap:wrap; }
  header h1 { font-size: 20px; margin:0; font-weight:600; }
  .status { font-size: 13px; color: var(--muted); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#64748b; margin-right:6px; vertical-align:middle; }
  .dot.on { background: var(--ok); box-shadow:0 0 8px var(--ok); }
  main { max-width: 1100px; margin:0 auto; padding: 20px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:20px; }
  .card { background: var(--card); border-radius:14px; padding:18px; border:1px solid #334155; }
  .card .label { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .card .value { font-size:38px; font-weight:700; margin-top:6px; }
  .card .unit { font-size:16px; color:var(--muted); margin-left:4px; }
  .card.hero .value { font-size:52px; color: var(--temp); }
  .chart-wrap { background: var(--card); border-radius:14px; padding:18px; border:1px solid #334155; }
  canvas { width:100% !important; }
  .sub { color: var(--muted); font-size:13px; margin-top:8px; }
  .btn { background: var(--accent); color:#04121f; border:0; border-radius:10px; padding:10px 16px; font-weight:600; cursor:pointer; font-size:14px; }
  .btn:hover { filter:brightness(1.1); }
  .btn:disabled { opacity:.6; cursor:default; }
  .table-wrap { background: var(--card); border-radius:14px; padding:18px; border:1px solid #334155; margin-top:20px; }
  .table-wrap h2 { font-size:14px; margin:0 0 12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .table-scroll { max-height:420px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px 10px; text-align:right; border-bottom:1px solid #33415555; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  thead th { position:sticky; top:0; background:var(--card); color:var(--muted); z-index:1; }
</style>
</head>
<body>
<header>
  <h1>Temperatura &middot; Generador</h1>
  <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
    <div class="status"><span id="dot" class="dot"></span><span id="st">conectando&hellip;</span></div>
    <button id="btnExport" class="btn">Exportar Excel</button>
  </div>
</header>
<main>
  <div class="cards">
    <div class="card hero"><div class="label">Temperatura actual</div><div class="value"><span id="temp">--</span><span class="unit">&deg;C</span></div></div>
    <div class="card"><div class="label">M&iacute;nima</div><div class="value"><span id="tmin">--</span><span class="unit">&deg;C</span></div></div>
    <div class="card"><div class="label">M&aacute;xima</div><div class="value"><span id="tmax">--</span><span class="unit">&deg;C</span></div></div>
  </div>
  <div class="chart-wrap">
    <canvas id="chart" height="120"></canvas>
    <div class="sub" id="upd">Sin datos todav&iacute;a.</div>
  </div>

  <div class="table-wrap">
    <h2>Registros <span id="cnt" class="sub"></span></h2>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Fecha y hora</th><th>Temperatura (&deg;C)</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyApWW1rvqDy_eUsxbYtEMu3zYRjZmxI-bo",
  authDomain: "sensoresdegenerador.firebaseapp.com",
  databaseURL: "https://sensoresdegenerador-default-rtdb.firebaseio.com",
  projectId: "sensoresdegenerador",
  storageBucket: "sensoresdegenerador.firebasestorage.app",
  messagingSenderId: "1009024953926",
  appId: "1:1009024953926:web:b5b2c1abb274b8403a2447"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = (id) => document.getElementById(id);
const dot = $("dot"), st = $("st");
const TZ = "America/Tegucigalpa";

const valid = (t) => (t != null && Number(t) > -100);
const showT = (t) => valid(t) ? Number(t).toFixed(2) : "--";

const chart = new Chart($("chart").getContext("2d"), {
  type: "line",
  data: { labels: [], datasets: [
    { label: "Temperatura (\u00b0C)", data: [], borderColor: "#22c55e", backgroundColor: "rgba(34,197,94,.15)", fill: true, tension: .3, pointRadius: 0, yAxisID: "y" }
  ]},
  options: {
    responsive: true, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: { legend: { labels: { color: "#e2e8f0" } } },
    scales: {
      x: { ticks: { color: "#94a3b8", maxTicksLimit: 8 }, grid: { color: "#33415555" } },
      y: { position: "left", ticks: { color: "#22c55e" }, grid: { color: "#33415555" }, title: { display: true, text: "\u00b0C", color: "#22c55e" } }
    }
  }
});

const fmtTime = (ts) => new Date(ts).toLocaleTimeString("es-HN", { timeZone: TZ });

onValue(ref(db, "temperatura/latest"), (snap) => {
  const d = snap.val();
  if (!d) return;
  $("temp").textContent = showT(d.temp);
  dot.classList.add("on");
  const secs = Math.round((Date.now() - d.ts) / 1000);
  st.textContent = "en vivo \u00b7 actualizado hace " + secs + " s";
  $("upd").textContent = "\u00daltima lectura: " + new Date(d.ts).toLocaleString("es-HN", { timeZone: TZ });
});

const seen = {};
const renderTable = (rows) => {
  const tb = $("tbody");
  tb.innerHTML = "";
  rows.slice().reverse().forEach((r) => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + new Date(r.ts).toLocaleString("es-HN", { timeZone: TZ }) + "</td>" +
      "<td>" + showT(r.temp) + "</td>";
    tb.appendChild(tr);
  });
  const vals = rows.map((r) => Number(r.temp)).filter(valid);
  $("tmin").textContent = vals.length ? Math.min(...vals).toFixed(2) : "--";
  $("tmax").textContent = vals.length ? Math.max(...vals).toFixed(2) : "--";
  $("cnt").textContent = rows.length ? "(" + rows.length + " \u00faltimos)" : "";
};

onValue(query(ref(db, "temperatura/history"), limitToLast(120)), (snap) => {
  snap.forEach((child) => { seen[child.key] = child.val(); });
  const rows = Object.values(seen).sort((a, b) => a.ts - b.ts).slice(-120);
  chart.data.labels = rows.map((r) => fmtTime(r.ts));
  chart.data.datasets[0].data = rows.map((r) => valid(r.temp) ? Number(r.temp) : null);
  chart.update();
  renderTable(rows);
});

$("btnExport").addEventListener("click", async () => {
  const btn = $("btnExport");
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "Exportando\u2026";
  try {
    const res = await fetch(firebaseConfig.databaseURL + "/temperatura/history.json");
    const data = (await res.json()) || {};
    const rows = Object.values(data).sort((a, b) => a.ts - b.ts);
    if (!rows.length) { alert("Todav\u00eda no hay registros."); return; }
    const aoa = rows.map((r) => ({
      "Fecha y hora": new Date(r.ts).toLocaleString("es-HN", { timeZone: TZ }),
      "Temperatura (\u00b0C)": valid(r.temp) ? Number(r.temp) : "",
      "Timestamp (ms)": r.ts
    }));
    const ws = XLSX.utils.json_to_sheet(aoa);
    ws["!cols"] = [{wch:20},{wch:16},{wch:15}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Temperatura");
    XLSX.writeFile(wb, "temperatura_registros.xlsx");
  } catch (e) {
    alert("Error al exportar: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
});
</script>
</body>
</html>
